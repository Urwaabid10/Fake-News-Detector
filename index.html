<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector - Truth Engine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="maincon">
        <h1>
            Fake News Detector
        </h1>
        <p class="firstline">
            Analyse Article ,Social Media Posts and Headlines for Credibility
        </p>
    </div>
    <div class="demo-buttons" style="display: flex; gap: 10px; margin-bottom: 10px; justify-content: center;">
        <button onclick="prefillDemo('fake')" class="demo-btn fake"
            style="background-color: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Demo:
            Fake News</button>
        <button onclick="prefillDemo('real')" class="demo-btn real"
            style="background-color: #00C851; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Demo:
            Real News</button>
        <button onclick="prefillDemo('scam')" class="demo-btn scam"
            style="background-color: #ffbb33; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Demo:
            Scam</button>
    </div>
    <div class="container">
        <textarea name="entertext" id="entertext" cols="70vw" rows="20vh"
            placeholder="Enter the text or article to check..."></textarea>
        <div class="button1">
            <button class="uploadbtn">Upload Screenshot or Document</button>
            <button class="analysebtn" onclick="Analyse()">Analyse</button>
        </div>
        <!-- Track 2: EasyConnect Integration -->
        <div class="webhook-section">
            <input type="text" id="webhook-url" placeholder="Optional: Paste Zapier/Make Webhook URL here..."
                class="glass-input">
        </div>

        <!-- Qubic Verification Button -->
        <div class="qubic-section" style="display:flex; justify-content:center; margin-top:20px;">
            <button onclick="verifyOnQubic()" class="qubic-btn"
                style="display:none; background-color: #4361ee; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.1); align-items: center; gap: 8px;">
                <span style="font-size: 1.2em;">⬢</span> Verify Proof on Qubic Network
            </button>
        </div>
        <div id="qubic-status"
            style="text-align: center; margin-top: 10px; margin-bottom: 20px; color: #4361ee; font-weight: 500; min-height: 20px; height: auto;">
        </div>
    </div>
    <div class="results">

        <div class="credibility">
            <h3>Credibilty Score</h3>
            <p class="score"></p>
        </div>
        <div class="cred">
            <div class="credvalue">
                <h3>Credibilty Value</h2>
            </div>

            <div class="phrase">
                <h3>Highlighted Phrase</h3>
            </div>
        </div>
    </div>
    <div class="sources">
        <p>
        <h2>Trusted Sources</h2>
        <ul>
            <li>Reuters</li>
            <li>BBC News</li>
            <li>The Associated Press</li>
        </ul>
        </p>
    </div>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
</body>

</html>
